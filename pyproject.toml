[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "faithfulagent"
version = "0.1.0"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "pydantic>=2.0",
  "jsonpath-ng>=1.6",
  "rapidfuzz>=3.0",
  "openai>=2.28.0",
]

[project.optional-dependencies]
heuristic = [
    "spacy>=3.7",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "syrupy>=4.0",
  "ruff>=0.4",
  "mypy>=1.10",
]

[tool.pytest.ini_options]
addopts = "--cov=faithfulagent --cov-fail-under=90"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
strict = true
python_version = "3.10"
